[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfe-local"
version = "0.1.0"
description = "Visualizador, validador e analisador em lote local de NF-e, NFC-e e NFS-e Padrão Nacional"
readme = "CLAUDE.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Giovani Felippe Rodrigues" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "lxml>=5.1.0",
    "openpyxl>=3.1.2",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "requests-pkcs12>=1.24",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
nfe-local = "api.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["parsers*", "models*", "validators*", "reports*", "sefaz*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
